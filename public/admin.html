<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OneCode+ Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#062240;--bg2:#0a2d52;--bg3:#041a31;--ink:#fff;--mute:#9fb6cf;--line:rgba(255,255,255,.14);--sky:#6db3ff;--blue:#2f6bff;--blue2:#1f3fd0;--green:#2ecc88;--amber:#f5a524;--red:#ff6b70;--sh:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
svg{display:block}
.hide{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(47,107,255,.28),transparent 45%),radial-gradient(circle at 90% 95%,rgba(109,179,255,.18),transparent 40%),var(--bg)}
.lbox{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--line);border-radius:28px;padding:38px 34px;box-shadow:var(--sh),0 30px 60px rgba(0,0,0,.35);text-align:center}
.lbox .lg{width:72px;height:72px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#12396a,#0a2d52);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.lbox .lg svg{width:42px;height:30px}
.lbox h1{margin:0 0 4px;font-size:1.6rem}
.lbox p{margin:0 0 22px;color:var(--mute)}
.lbox input{width:100%;height:54px;padding:0 20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#0f3563,#0a2d52);margin-bottom:14px;outline:none;transition:border .2s,box-shadow .2s}
.lbox input::placeholder{color:var(--mute)}
.lbox input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(109,179,255,.18)}
.btn{border:0;cursor:pointer;font-weight:600;color:#fff;padding:0 22px;height:48px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2));box-shadow:0 10px 24px rgba(47,107,255,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(47,107,255,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.full{width:100%;height:54px;font-size:1.05rem}
.btn.soft{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.soft:hover{background:rgba(255,255,255,.12);box-shadow:none}
.err{color:var(--red);min-height:1.4em;margin-top:12px;font-size:.92rem}

/* LAYOUT */
.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--bg3);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;z-index:10}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.2rem;padding:0 8px 26px}
.brand i{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#12396a,#0a2d52);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
.brand i svg{width:24px;height:17px}
.brand b{color:var(--sky)}
.nav{display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:99px;color:var(--mute);cursor:pointer;font-weight:500;text-align:left;transition:background .2s,color .2s}
.nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 10px 22px rgba(47,107,255,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.sp{flex:1}
.out{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:12px 14px;border-radius:99px;color:var(--mute);cursor:pointer;font-weight:500}
.out:hover{color:var(--red);border-color:rgba(255,107,112,.4)}
.out svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.main{margin-left:0;padding:26px 32px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.top h2{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--mute)}
.tr{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:600;box-shadow:0 8px 18px rgba(47,107,255,.45)}

/* CARDS */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.card{background:var(--bg2);border-radius:24px;padding:22px;box-shadow:var(--sh);border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s}
.stat:hover{transform:translateY(-4px);border-color:rgba(109,179,255,.5);box-shadow:0 16px 36px rgba(47,107,255,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.stat .h{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-weight:500}
.stat .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.stat .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-size:2.3rem;font-weight:600;letter-spacing:-.02em;margin:10px 0 2px;line-height:1.1}
.stat .sub{color:var(--mute);font-size:.88rem}
.stat .sk{height:46px;margin-top:10px}
.sk svg{width:100%;height:100%}
.row2{display:grid;grid-template-columns:1.8fr 1fr;gap:18px;margin-bottom:18px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.ch h3{margin:0;font-size:1.1rem}
.ch small{color:var(--mute)}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--mute);font-weight:500}
.seg button.on{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.45)}
#chart{width:100%;height:auto}
#chart .gl{stroke:rgba(255,255,255,.1);stroke-width:1}
#chart text{fill:var(--mute);font-size:11px;font-family:Outfit,sans-serif}
#chart .ln{fill:none;stroke:var(--sky);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 10px rgba(109,179,255,.55))}
#chart .dotp{fill:var(--bg2);stroke:var(--sky);stroke-width:2.5;opacity:0;transition:opacity .15s}
#chart .hit:hover+.dotp{opacity:1}
.donutwrap{display:grid;place-items:center;position:relative;margin:6px 0 16px}
.donutwrap .mid{position:absolute;text-align:center}
.mid b{display:block;font-size:2rem;line-height:1.1}
.mid span{color:var(--mute);font-size:.85rem}
.leg{display:grid;gap:10px}
.leg div{display:flex;align-items:center;justify-content:space-between;color:var(--mute)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px}
.leg b{color:var(--ink)}
.seg2{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}

/* LISTS & TABLE */
.recent{display:grid;gap:4px}
.ri{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:16px;transition:background .2s}
.ri:hover{background:rgba(255,255,255,.05)}
.av{width:42px;height:42px;border-radius:14px;background:rgba(109,179,255,.16);color:var(--sky);display:grid;place-items:center;font-weight:600;flex:none}
.ri .t{flex:1;min-width:0}
.ri .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .t small{color:var(--mute)}
.ri .dt{color:var(--mute);font-size:.85rem}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-size:.8rem;font-weight:500}
.p-new{background:rgba(79,139,255,.2);color:#8fbaff}
.p-in{background:rgba(245,165,36,.18);color:#ffc15a}
.p-done{background:rgba(46,204,136,.18);color:#5be0a4}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:220px;height:48px;padding:0 20px;border:1px solid var(--line);border-radius:99px;background:linear-gradient(180deg,#0f3563,#0a2d52);outline:none}
.search::placeholder{color:var(--mute)}
.search:focus,select:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(109,179,255,.18)}
select{height:48px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:#0f3563;outline:none;cursor:pointer}
td select{height:36px;border-radius:99px;font-size:.9rem}
select option{background:#0a2d52;color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{color:var(--mute);font-weight:500;font-size:.83rem;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line);font-size:.95rem}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.04)}
tr:last-child td{border-bottom:0}
.del{border:1px solid rgba(255,107,112,.45);color:var(--red);background:transparent;padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:500;transition:background .2s}
.del:hover{background:rgba(255,107,112,.12)}
.empty{padding:40px;text-align:center;color:var(--mute)}

@media(max-width:1100px){.grid4{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
@media(max-width:860px){
.main{margin-left:0;padding:20px 16px 40px}
.top{flex-wrap:wrap}.tr{flex-wrap:wrap}
}
@media(max-width:520px){.grid4{grid-template-columns:1fr}.top h2{font-size:1.4rem}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="lbox" id="loginForm">
    <div class="lg"><svg viewBox="113 580 720 505" fill="#fff"><polygon points="113,840 268,720 317,722 317,752 200,842 305,923 275,950 250,950"/><polygon points="833,845 688,727 650,755 752,843 652,917 652,950 697,950"/><polygon points="383,688 602,582 602,727 475,810 475,716 383,757"/><polygon points="520,800 595,775 595,992 468,1085 470,880"/><path d="M221 1047 L710 678 C640 740 560 800 470 878 Z"/></svg></div>
    <h1>Welcome back</h1>
    <p>Sign in to your dashboard</p>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
    <button class="btn full" type="submit">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <main class="main">
    <div class="top">
      <div><h2 id="ttl">Overview</h2><p id="tsub">Here is what is happening with your orders</p></div>
      <div class="tr">
        <div class="seg vtabs"><button class="on" data-v="overview">Overview</button><button data-v="orders">Orders</button></div>
        <button class="btn soft" id="refresh">Refresh</button>
        <button class="btn soft" id="logout">Log out</button>
        <div class="ava">A</div>
      </div>
    </div>

    <!-- OVERVIEW -->
    <section id="v-overview">
      <div class="grid4" id="stats"></div>
      <div class="row2">
        <div class="card anim">
          <div class="ch"><div><h3>Orders over time</h3><small id="rangeSum"></small></div>
            <div class="seg" id="seg"><button data-r="7" class="on">7 days</button><button data-r="30">30 days</button><button data-r="90">90 days</button></div></div>
          <svg id="chart" viewBox="0 0 640 250"></svg>
        </div>
        <div class="card anim">
          <div class="ch"><h3>Order status</h3></div>
          <div class="donutwrap">
            <svg width="190" height="190" viewBox="0 0 190 190" id="donut"></svg>
            <div class="mid"><b id="dTotal">0</b><span>orders</span></div>
          </div>
          <div class="leg" id="leg"></div>
        </div>
      </div>
      <div class="card anim">
        <div class="ch"><h3>Recent orders</h3><button class="btn soft" id="seeAll" style="height:40px">View all</button></div>
        <div class="recent" id="recent"></div>
      </div>
    </section>

    <!-- ORDERS -->
    <section id="v-orders" class="hide">
      <div class="card anim">
        <div class="tools">
          <input class="search" id="q" placeholder="Search by name, email, phone or company">
          <select id="filter"><option value="">All statuses</option><option value="new">New</option><option value="in progress">In progress</option><option value="done">Done</option></select>
        </div>
        <div class="tw"><table>
          <thead><tr><th>Date</th><th>Full name</th><th>Email</th><th>Phone</th><th>Company</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div class="empty hide" id="empty">No orders found.</div>
      </div>
    </section>
  </main>
</div>

<script src="/libs/motion/motion.js"></script>
<script>
var token = sessionStorage.getItem('token') || '';
var orders = [], range = 7, view = 'overview', first = true;
var $ = function(id){ return document.getElementById(id); };
var COL = {'new':'#4f8bff','in progress':'#f5a524','done':'#2ecc88'};
var NAME = {'new':'New','in progress':'In progress','done':'Done'};

/* ---------- API ---------- */
function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json','x-token':token}, opts.headers || {});
  return fetch(path, opts).then(function(r){
    if(r.status === 401 && path.indexOf('/login') === -1){ logout(); throw new Error('auth'); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'Error'); return j; });
  });
}
function show(){
  $('login').classList.toggle('hide', !!token);
  $('app').classList.toggle('hide', !token);
  if(token) load();
}
function logout(){ token = ''; sessionStorage.removeItem('token'); show(); }
function load(){ api('/api/admin/orders').then(function(d){ orders = d; render(); }).catch(function(){}); }

$('loginForm').addEventListener('submit', function(e){
  e.preventDefault(); $('loginErr').textContent = '';
  api('/api/admin/login', {method:'POST', body:JSON.stringify({password:$('pw').value})})
    .then(function(j){ token = j.token; sessionStorage.setItem('token', token); $('pw').value = ''; show(); })
    .catch(function(err){ $('loginErr').textContent = err.message; });
});
$('logout').addEventListener('click', logout);
$('refresh').addEventListener('click', load);
$('seeAll').addEventListener('click', function(){ setView('orders'); });
$('q').addEventListener('input', renderTable);
$('filter').addEventListener('change', renderTable);
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  range = +b.dataset.r;
  document.querySelectorAll('#seg button').forEach(function(x){ x.classList.toggle('on', x === b); });
  renderChart();
});
document.querySelectorAll('.vtabs button').forEach(function(b){
  b.addEventListener('click', function(){ setView(b.dataset.v); });
});

function setView(v){
  view = v;
  document.querySelectorAll('.vtabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  $('v-overview').classList.toggle('hide', v !== 'overview');
  $('v-orders').classList.toggle('hide', v !== 'orders');
  $('ttl').textContent = v === 'overview' ? 'Overview' : 'Orders';
  $('tsub').textContent = v === 'overview' ? 'Here is what is happening with your orders' : 'Search, update and manage every order';
  if(v === 'overview'){ renderChart(); renderDonut(); }
  enter($(v === 'overview' ? 'v-overview' : 'v-orders'));
}

/* ---------- animation (Motion) ---------- */
function enter(box){
  try{
    var els = box.querySelectorAll('.anim');
    if(window.Motion && els.length){
      Motion.animate(els, {opacity:[0,1], transform:['translateY(20px)','translateY(0px)']}, {duration:.55, delay:Motion.stagger(.08)});
    }
  }catch(e){}
}
function count(el, n){
  var t0 = null;
  (function f(t){
    if(!t0) t0 = t;
    var p = Math.min((t - t0) / 900, 1);
    el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(f);
  })(performance.now());
}

/* ---------- helpers ---------- */
function dayKey(d){ return new Date(d).toLocaleDateString('en-CA'); }
function lastDays(n){
  var out = [], now = new Date();
  for(var i = n - 1; i >= 0; i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    out.push({key: d.toLocaleDateString('en-CA'), label: d.toLocaleDateString('en-US', {month:'short', day:'numeric'})});
  }
  return out;
}
function series(list, n){
  var days = lastDays(n), map = {};
  list.forEach(function(o){ var k = dayKey(o.created_at); map[k] = (map[k] || 0) + 1; });
  return days.map(function(d){ return {label:d.label, v:map[d.key] || 0}; });
}
function smooth(p){
  if(p.length < 2) return '';
  var d = 'M' + p[0].x + ',' + p[0].y;
  for(var i = 0; i < p.length - 1; i++){
    var p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2;
    d += ' C' + (p1.x + (p2.x - p0.x)/6) + ',' + (p1.y + (p2.y - p0.y)/6) + ' ' + (p2.x - (p3.x - p1.x)/6) + ',' + (p2.y - (p3.y - p1.y)/6) + ' ' + p2.x + ',' + p2.y;
  }
  return d;
}

/* ---------- render ---------- */
function render(){
  renderStats(); renderChart(); renderDonut(); renderRecent(); renderTable();
  if(first){ first = false; enter($('v-overview')); }
}

function renderStats(){
  var defs = [
    {k:'', t:'Total orders', c:'#6db3ff', bg:'rgba(109,179,255,.16)', ic:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>'},
    {k:'new', t:'New', c:'#4f8bff', bg:'rgba(79,139,255,.18)', ic:'<path d="M12 5v14M5 12h14"/>'},
    {k:'in progress', t:'In progress', c:'#f5a524', bg:'rgba(245,165,36,.18)', ic:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
    {k:'done', t:'Done', c:'#2ecc88', bg:'rgba(46,204,136,.18)', ic:'<path d="m5 13 4 4L19 7"/>'}
  ];
  var box = $('stats'); box.innerHTML = '';
  defs.forEach(function(d, idx){
    var list = d.k ? orders.filter(function(o){ return o.status === d.k; }) : orders;
    var s = series(list, 7), max = Math.max(1, Math.max.apply(null, s.map(function(x){ return x.v; })));
    var pts = s.map(function(x, i){ return {x: 4 + i * (192 / 6), y: 40 - (x.v / max) * 34}; });
    var line = smooth(pts);
    var week = s.reduce(function(a, x){ return a + x.v; }, 0);
    var el = document.createElement('div');
    el.className = 'card stat anim';
    el.innerHTML = '<div class="h"><span>' + d.t + '</span><span class="ic" style="background:' + d.bg + ';color:' + d.c + '"><svg viewBox="0 0 24 24">' + d.ic + '</svg></span></div>' +
      '<div class="v">0</div><div class="sub">' + week + ' in the last 7 days</div>' +
      '<div class="sk"><svg viewBox="0 0 200 46" preserveAspectRatio="none"><defs><linearGradient id="sg' + idx + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + d.c + '" stop-opacity=".35"/><stop offset="1" stop-color="' + d.c + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + line + ' L196,46 L4,46 Z" fill="url(#sg' + idx + ')"/><path d="' + line + '" fill="none" stroke="' + d.c + '" stroke-width="2.4" stroke-linecap="round"/></svg></div>';
    box.appendChild(el);
    count(el.querySelector('.v'), list.length);
  });
}

function renderChart(){
  var s = series(orders, range), W = 640, H = 250, L = 34, R = 14, T = 14, B = 30;
  var max = Math.max(3, Math.max.apply(null, s.map(function(x){ return x.v; })));
  max = Math.ceil(max / 3) * 3;
  var iw = W - L - R, ih = H - T - B;
  var pts = s.map(function(x, i){ return {x: L + i * (iw / (s.length - 1)), y: T + ih - (x.v / max) * ih, v:x.v, l:x.label}; });
  var line = smooth(pts), svg = '';
  svg += '<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6db3ff" stop-opacity=".4"/><stop offset="1" stop-color="#6db3ff" stop-opacity="0"/></linearGradient></defs>';
  for(var g = 0; g <= 3; g++){
    var gy = T + ih - (g / 3) * ih;
    svg += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '"/><text x="' + (L - 10) + '" y="' + (gy + 4) + '" text-anchor="end">' + Math.round(max * g / 3) + '</text>';
  }
  var step = Math.ceil(s.length / 7);
  pts.forEach(function(p, i){ if(i % step === 0 || i === pts.length - 1) svg += '<text x="' + p.x + '" y="' + (H - 8) + '" text-anchor="middle">' + p.l + '</text>'; });
  svg += '<path d="' + line + ' L' + pts[pts.length-1].x + ',' + (T + ih) + ' L' + pts[0].x + ',' + (T + ih) + ' Z" fill="url(#ar)" id="areaP" style="opacity:0;transition:opacity .9s .4s"/>';
  svg += '<path class="ln" id="lineP" d="' + line + '"/>';
  var bw = iw / (s.length - 1);
  pts.forEach(function(p){
    svg += '<g><rect class="hit" x="' + (p.x - bw/2) + '" y="' + T + '" width="' + bw + '" height="' + ih + '" fill="transparent"/><circle class="dotp" cx="' + p.x + '" cy="' + p.y + '" r="5"/><title>' + p.l + ': ' + p.v + ' orders</title></g>';
  });
  $('chart').innerHTML = svg;
  var total = s.reduce(function(a, x){ return a + x.v; }, 0);
  $('rangeSum').textContent = total + ' orders in the last ' + range + ' days';
  var lp = $('lineP'), len = lp.getTotalLength();
  lp.style.strokeDasharray = len; lp.style.strokeDashoffset = len;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    lp.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)'; lp.style.strokeDashoffset = 0;
    $('areaP').style.opacity = 1;
  }); });
}

function renderDonut(){
  var keys = ['new', 'in progress', 'done'], C = 2 * Math.PI * 70, total = orders.length, acc = 0, svg = '';
  svg += '<circle cx="95" cy="95" r="70" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="20"/>';
  var segs = [];
  keys.forEach(function(k){
    var n = orders.filter(function(o){ return o.status === k; }).length;
    var len = total ? (n / total) * C : 0;
    svg += '<circle class="seg2" cx="95" cy="95" r="70" fill="none" stroke="' + COL[k] + '" stroke-width="20" stroke-linecap="butt" transform="rotate(-90 95 95)" stroke-dasharray="0 ' + C + '" stroke-dashoffset="' + (-acc) + '" data-len="' + len + '"/>';
    acc += len;
    segs.push({k:k, n:n});
  });
  $('donut').innerHTML = svg;
  $('dTotal').textContent = total;
  $('leg').innerHTML = segs.map(function(s){
    var pct = total ? Math.round(s.n / total * 100) : 0;
    return '<div><span><i style="background:' + COL[s.k] + '"></i>' + NAME[s.k] + '</span><b>' + s.n + ' · ' + pct + '%</b></div>';
  }).join('');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    document.querySelectorAll('#donut .seg2').forEach(function(c){
      var len = Math.max(0, +c.dataset.len - 3);
      c.style.strokeDasharray = (len > 0 ? len : 0) + ' ' + C;
    });
  }); });
}

function pillClass(s){ return s === 'done' ? 'p-done' : s === 'in progress' ? 'p-in' : 'p-new'; }

function renderRecent(){
  var box = $('recent'); box.innerHTML = '';
  if(!orders.length){ box.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  orders.slice(0, 6).forEach(function(o){
    var r = document.createElement('div'); r.className = 'ri';
    var av = document.createElement('div'); av.className = 'av'; av.textContent = (o.full_name || '?').charAt(0).toUpperCase();
    var t = document.createElement('div'); t.className = 't';
    var b = document.createElement('b'); b.textContent = o.full_name;
    var sm = document.createElement('small'); sm.textContent = (o.company ? o.company + ' · ' : '') + o.email;
    t.appendChild(b); t.appendChild(sm);
    var d = document.createElement('span'); d.className = 'dt'; d.textContent = new Date(o.created_at).toLocaleDateString();
    var p = document.createElement('span'); p.className = 'pill ' + pillClass(o.status); p.textContent = NAME[o.status] || o.status;
    r.appendChild(av); r.appendChild(t); r.appendChild(d); r.appendChild(p);
    box.appendChild(r);
  });
}

function renderTable(){
  var q = $('q').value.toLowerCase(), f = $('filter').value;
  var list = orders.filter(function(o){
    var hay = [o.full_name, o.email, o.phone, o.company].join(' ').toLowerCase();
    return hay.indexOf(q) > -1 && (!f || o.status === f);
  });
  var tb = $('rows'); tb.innerHTML = '';
  $('empty').classList.toggle('hide', list.length > 0);
  list.forEach(function(o){
    var tr = document.createElement('tr');
    [new Date(o.created_at).toLocaleString(), o.full_name, o.email, o.phone || '-', o.company || '-'].forEach(function(t){
      var td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
    });
    var tdS = document.createElement('td'), sel = document.createElement('select');
    ['new', 'in progress', 'done'].forEach(function(s){
      var op = document.createElement('option'); op.value = s; op.textContent = NAME[s]; if(o.status === s) op.selected = true; sel.appendChild(op);
    });
    sel.addEventListener('change', function(){
      api('/api/admin/orders/' + o.id, {method:'PATCH', body:JSON.stringify({status:sel.value})}).then(load).catch(function(e){ alert(e.message); });
    });
    tdS.appendChild(sel); tr.appendChild(tdS);
    var tdD = document.createElement('td'), del = document.createElement('button');
    del.className = 'del'; del.textContent = 'Delete';
    del.addEventListener('click', function(){
      if(confirm('Delete the order of ' + o.full_name + '?')){
        api('/api/admin/orders/' + o.id, {method:'DELETE'}).then(load).catch(function(e){ alert(e.message); });
      }
    });
    tdD.appendChild(del); tr.appendChild(tdD);
    tb.appendChild(tr);
  });
}

show();
</script>
</body>
